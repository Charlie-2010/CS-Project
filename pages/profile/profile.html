<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="icon" type="image/png" href="../../assets/Logo(1).png">
    <link rel="stylesheet" href="profile-style.css">
    <link rel="stylesheet" href="../shared-ui.css">
</head>
<body>
    <div class="dashboard-container profile-container">
        <!-- Sidebar Navigation Menu Left Sticky Anchor -->
        <aside class="sidebar-nav" id="sidebar">
            <div class="sidebar-nav__toggle" id="sidebar-toggle">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>

            <nav class="sidebar-nav__menu">
                <div class="menu-cluster">
                    <a href="../dashboard/dashboard.html" class="menu-cluster__link">
                        <span class="nav-icon">⊞</span>
                        <span class="nav-label">Dashboard</span>
                    </a>
                    <a href="../messages/messages.html" class="menu-cluster__link">
                        <span class="nav-icon">✉</span>
                        <span class="nav-label">Messages</span>
                    </a>
                    <a href="../tasks/tasks.html" class="menu-cluster__link">
                        <span class="nav-icon">✓</span>
                        <span class="nav-label">Tasks</span>
                    </a>
                    <a href="../calender/calender.html" class="menu-cluster__link">
                        <span class="nav-icon">📆</span>
                        <span class="nav-label">Calendar</span>
                    </a>
                    <a href="../reports/reports.html" class="menu-cluster__link">
                        <span class="nav-icon">📊</span>
                        <span class="nav-label">Reports</span>
                    </a>
                </div>

                <div class="menu-cluster menu-cluster--bottom">
                    <a href="../settings/settings.html" class="menu-cluster__link">
                        <span class="nav-icon">⚙</span>
                        <span class="nav-label">Settings</span>
                    </a>
                </div>
            </nav>
        </aside>

        <!-- Main Body Content Workspace Component Wrapper -->
        <div class="main-wrapper">
            <!-- Global Top Header Section -->
            <header class="profile-header">
                <h1 class="profile-title">Profile Settings</h1>
                <div class="filter-controls">
                    <span class="filter-label">Filter:</span>
                    <button type="button" class="filter-opt active" data-filter="weekly">Weekly</button> /
                    <button type="button" class="filter-opt" data-filter="monthly">Monthly</button> /
                    <button type="button" class="filter-opt" data-filter="overall">Overall</button>
                </div>
            </header>

            <!-- Two-Column Workspace Layout Section -->
            <div class="profile-workspace-grid">
                
                <!-- Left Column Panel Card: Developer Node / Avatar Display -->
                <div class="profile-card profile-card--left">
                    <div class="developer-node-container">
                        <!-- Futuristic HUD Layout Graphic Ring System -->
                        <div class="hud-outer-ring">
                            <div class="hud-inner-ring">
                                <div class="avatar-image-frame">
                                    <span class="avatar-initials" aria-label="Profile initials">MS</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Metadata Text List Block Group -->
                    <div class="metadata-block">
                        <p class="meta-line">Username: <span class="meta-val">monikaS</span></p>
                        <p class="meta-line">Email: <span class="meta-val">email@gmail.com</span></p>
                        <p class="meta-line">Time zone: <span class="meta-val">Choose a time zone</span></p>
                    </div>
                </div>

                <!-- Right Column Panel Layout: Form Parameters + Performance Parameters -->
                <div class="profile-forms-column">
                    <!-- Section Card 1: Account Parameters Grid Input Controls -->
                    <div class="profile-card">
                        <h2 class="section-title">Account Parameters</h2>
                        <div class="form-row">
                            <div class="form-group flex-1">
                                <label class="form-label" for="username-field">Username</label>
                                <input type="text" id="username-field" class="form-input" value="monikaS" placeholder="Enter username" disabled>
                            </div>
                            <div class="form-group flex-1">
                                <label class="form-label" for="email-field">Email</label>
                                <input type="email" id="email-field" class="form-input" value="email@gmail.com" placeholder="Enter email address" disabled>
                            </div>
                            <div class="form-group flex-1">
                                <label class="form-label" for="timezone-select">Preferred Time Zone</label>
                                <div class="select-wrapper">
                                    <select id="timezone-select" class="form-input form-select" disabled>
                                        <option value="default" selected>Choose a time zone</option>
                                        <option value="utc">UTC (Coordinated Universal Time)</option>
                                        <option value="est">EST (Eastern Standard Time)</option>
                                        <option value="ist">IST (Indian Standard Time)</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Section Card 2: Performance Progression Metric Tracking Blocks -->
                    <div class="profile-card">
                        <h2 class="section-title">Academic Metrics</h2>
                        <div class="metrics-row-layout">
                            <div class="metric-progress-wrapper">
                                <div class="metric-meta-labels">
                                    <span class="metric-name">Project Milestones</span>
                                    <span class="metric-percentage" id="milestones-pct">72%</span>
                                </div>
                                <div class="progress-track-bar">
                                    <div class="progress-fill-cyan" id="milestones-bar" style="width: 72%;"></div>
                                </div>
                            </div>
                            
                            <div class="semester-avg-box">
                                <label class="form-label">Semester Avg</label>
                                <div class="avg-display-pill" id="semester-avg-val">88%</div>
                            </div>
                        </div>
                    </div>

                    <!-- Section Card 3: Ecosystem Code System Configurations Log -->
                    <div class="profile-card">
                        <h2 class="section-title">Full-stack Configuration Ecosystem</h2>
                        <div class="form-group">
                            <textarea class="ecosystem-textarea" readonly spellcheck="false">OS: Windows 11 | Backend: Node.js, Express.js, MySQL | Frontend: React.js | Services: Auth, Real-time Updates, Reporting | DB Schema: User, Tasks, Logs</textarea>
                        </div>
                    </div>

                    <!-- Lower Align Control Submission Block -->
                    <div class="form-actions-row">
                        <p id="profile-form-error" role="alert" class="profile-form-error"></p>
                        <button type="button" class="btn-secondary-profile" id="btn-edit-profile">Edit Profile</button>
                        <button type="button" class="btn-secondary-profile" id="btn-cancel-profile" hidden>Cancel</button>
                        <button type="button" class="btn-update-profile" id="btn-save-profile" hidden>Save Changes</button>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <script src="../shared-ui.js"></script>
    <script src="profile-script.js"></script>
</body>
</html>
